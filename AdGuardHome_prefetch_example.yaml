# AdGuard Home 配置示例 - 包含 Prefetch 配置

# DNS 服务器配置
dns:
  # 基本设置
  bind_hosts:
    - 0.0.0.0
  port: 53
  
  # 上游 DNS 服务器
  upstream_dns:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  
  # Bootstrap DNS (用于解析 DoH/DoT 服务器地址)
  bootstrap_dns:
    - 223.5.5.5
    - 119.29.29.29
  
  # DNS 缓存设置
  cache_enabled: true
  cache_size: 4194304  # 4MB
  cache_ttl_min: 60
  cache_ttl_max: 86400
  cache_optimistic: true
  
  # 域名路由缓存
  domain_cache_size: 10000
  
  # ========== Prefetch 配置 (DNS 缓存预取) ==========
  
  # 启用 DNS 预取功能
  # 功能: 自动刷新热门域名的缓存，减少查询延迟
  # 建议: 启用（除非设备性能极低或网络不稳定）
  prefetch_enabled: true
  
  # 热门域名阈值
  # 说明: 域名在时间窗口内被访问多少次后才会被视为"热门"并进行预取
  # 默认: 5
  # 调优:
  #   - 值越小，预取的域名越多（内存使用增加）
  #   - 值越大，只预取最热门的域名（节省资源）
  # 推荐:
  #   - 家庭用户: 3-5
  #   - 小型企业: 5-10
  #   - 大型部署: 10-20
  prefetch_threshold: 5
  
  # 热度统计时间窗口
  # 说明: 只统计此时间窗口内的访问次数，超出窗口的访问不计入热度
  # 默认: "1h" (1小时)
  # 格式: 时间字符串，如 "30m", "1h", "2h", "24h"
  # 示例: 设置为 "1h" + threshold=5，表示"1小时内访问5次"才算热门
  # 调优:
  #   - 时间窗口越短，热度统计越敏感，能快速响应访问模式变化
  #   - 时间窗口越长，热度统计越稳定，避免短期波动
  # 推荐:
  #   - 家庭用户: "1h" - 快速响应用户习惯变化
  #   - 小型企业: "2h" - 平衡响应速度和稳定性
  #   - 大型部署: "30m" - 快速适应高频访问模式
  # 注意: 时间窗口应该 >= 清理间隔，否则可能导致频繁清理
  prefetch_time_window: "1h"
  
  # 最大跟踪条目数
  # 说明: 最多跟踪多少个域名的访问记录
  # 默认: 10000
  # 内存估算: 10,000 条目 ≈ 1 MB
  # 调优:
  #   - 如果内存充足，可以增加到 20000-50000
  #   - 如果内存受限，可以降低到 5000
  # 推荐:
  #   - 家庭用户: 5000-10000
  #   - 小型企业: 10000-20000
  #   - 大型部署: 20000-50000
  prefetch_max_entries: 10000
  
  # 清理间隔
  # 说明: 多久清理一次不活跃的域名记录
  # 默认: "1h" (1小时)
  # 格式: 时间字符串，如 "30m", "1h", "2h30m"
  # 调优:
  #   - 如果内存增长快，缩短间隔（如 "30m"）
  #   - 如果内存稳定，可以延长（如 "2h"）
  # 推荐: "1h" (适合大多数场景)
  prefetch_cleanup_interval: "1h"
  
  # 最大并发刷新数
  # 说明: 同时进行的域名刷新操作数量
  # 默认: 50
  # 调优:
  #   - 低性能设备: 20-30
  #   - 普通设备: 40-60
  #   - 高性能服务器: 80-150
  # 注意: 值太高可能占用过多网络带宽和CPU
  prefetch_max_concurrent_refresh: 50
  
  # ========== 其他 DNS 设置 ==========
  
  # 速率限制
  ratelimit: 0  # 0 表示禁用
  
  # 其他选项
  refuse_any: true
  enable_dnssec: true
  aaaa_disabled: false

# 过滤器设置
filtering:
  protection_enabled: true
  filtering_enabled: true
  
# 其他设置...
